<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practica Diseño Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-topbar">
      <div class="header-logo">
        <img src="images/logo.svg" alt="Logo Trace">
      </div>
      <div class="header-content">
        <nav class="header-nav">
          <a href="">Características</a>
          <a href="">Precios</a>
          <a href="">Iniciar Sesión</a>
        </nav>
        <button>
          <span>Descargar</span>
          <img src="images/icon-dl.svg" alt="">
        </button>
      </div>
    </div>
    <div class="header-hero">
      <div class="header-hero-content">
        <h2>Tu vida, simplificada en la palma de tu mano</h2>
        <p>Vestibulum ac accumsan nulla, eget bibendum erat. Nullam lacinia sed felis cursus sodales.</p>
        <div class="hero-buttons">
          <button class="hero-button hero-button-demo">
            <span>Ver demo</span>
            <img src="images/icon-play.svg" alt="">
          </button>
          <button class="hero-button hero-button-dl">
            <span>Descargar</span>
            <img src="images/icon-dl.svg" alt="">
          </button>
        </div>
        <div class="hero-estadisticas">
          <div class="hero-estadistica">
            <img src="images/icon-users.svg" alt="">
            <span>+200,000 Usuarios</span>
          </div>
          <span class="separador"></span>
          <div class="hero-estadistica">
            <img src="images/icon-globe.svg" alt="">
            <span>+50 Países</span>
          </div>
        </div>
      </div>
      <img class="header-hero-img" src="images/1.png" alt="Teléfono en mano">
    </div>
  </header>
  <main>
    <section class="seccion-caracteristicas">
      <h3>Características</h3>
      <div></div>
    </section>
  </main>
  <footer></footer>
</body>
</html>
